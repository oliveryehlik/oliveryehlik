
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <!-- Critical for mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Oliver Yehlik</title>

  <style>
    /* Basic layout to keep text readable on desktop */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      margin: 0 auto;
      max-width: 600px; /* Limits width on big screens */
      padding: 1.5rem;  /* Keeps text away from phone screen edges */
      color: #222;
    }

    /* Fluid text sizes using clamp(minimum, preferred, maximum) */
    h1 {
      font-size: clamp(2rem, 5vw + 1rem, 3.5rem);
      line-height: 1.2;
    }

    h2 {
      font-size: clamp(1.4rem, 3vw + 0.8rem, 2rem);
    }

    p, li {
      font-size: clamp(1rem, 1vw + 0.8rem, 1.2rem);
    }
  </style>

</head>
  
<body>

  <h1>Oliver Yehlik</h1>
  <p>This text automatically scales nicely whether you are on a phone or a desktop screen!</p>

  <h2>About This Page</h2>
  <p>Add whatever text, images, or links you want down here.</p>

</body>
</html>
