<!doctype html>
<html lang="en">
  <head>
    <!-- Basic page metadata and the two local resources used by the site. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Writings, collages, and other creative works.">
    <title>Oliver Yehlik</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main>
      <!-- Introductory content shown above the file index. -->
      <header class="masthead">
        <p class="kicker">Oliver Yehlik</p>
        <h1>Assorted creativity<br><em>&amp; curiosities.</em></h1>
        <p class="lede">Writings, collages, and other creative works.</p>
        <img class="portrait" src="assets/images/olivermoroccosquare.webp" alt="Oliver Yehlik on a beach">
      </header>

      <!-- Add new files by copying an asset-row and updating its title, type, and href. -->
      <div class="library">
        <section class="collection" aria-labelledby="index-title">
          <div class="section-heading">
            <h2 id="index-title">Index</h2>
          </div>
          <a class="asset-row" href="assets/files/clearday.pdf" target="_blank" rel="noopener noreferrer">
            <span class="asset-name">On a clear day, you can see yourself.</span>
            <span class="asset-meta"><span>PDF</span><time datetime="2026-08-18">18 Aug 2026</time><span class="arrow" aria-hidden="true">&#8599;</span></span>
          </a>

          <!--
            Copy this asset-row when adding a new file:
            - Update href with the file's path.
            - Replace the title and file type.
            - Keep the time element when the file has a date.
          <a class="asset-row" href="assets/files/your-file.pdf" target="_blank" rel="noopener noreferrer">
            <span class="asset-name">Your file title</span>
            <span class="asset-meta"><span>PDF</span><time datetime="2026-09-17">17 Sep 2026</time><span class="arrow" aria-hidden="true">&#8599;</span></span>
          </a>
          -->
        </section>
      </div>

      <!-- This stays at the bottom of the page because main uses flex layout. -->
      <footer>
        <span>&copy; 2026 Oliver Yehlik</span>
        <span>Last updated September 2026</span>
      </footer>
    </main>
  </body>
</html>
